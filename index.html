<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント参加用 | Live App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-6">

  <main class="max-w-md mx-auto w-full my-auto">
    <div id="status-card" class="bg-white rounded-2xl shadow-xl p-6 transition-all duration-300 border border-slate-100">
      
      <!-- 待機画面 -->
      <div id="view-waiting" class="text-center py-8">
        <div class="inline-block p-4 rounded-full bg-indigo-50 text-indigo-600 mb-4 animate-pulse">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <h2 class="text-xl font-bold mb-2 text-slate-800">待機中</h2>
        <p class="text-sm text-slate-500">画面が開くまでしばらくお待ちください...</p>
      </div>

      <!-- 質問・回答画面 -->
      <div id="view-active" class="hidden">
        <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md mb-3">
          受付中の質問
        </span>
        <h2 id="question-text" class="text-xl font-bold text-slate-900 mb-6 leading-relaxed"></h2>

        <form id="comment-form" onsubmit="sendComment(event)" class="space-y-3">
          <input type="text" id="comment-input" placeholder="コメントを入力（スクリーンに流れます）" required
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
          <button type="submit" id="send-btn" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition-colors shadow-md">
            送信する
          </button>
        </form>
        <p id="send-msg" class="text-xs text-center text-emerald-600 font-bold mt-2 hidden">送信しました！</p>
      </div>

    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">
    Live Interactive System
  </footer>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzkgRXgoGDFvRDwC5toZefvsbKxRYfZV9EET6sosaj7yaDPGsJVgbIcVZbnQ8fAuA5_Yw/exec';

    const viewWaiting = document.getElementById('view-waiting');
    const viewActive = document.getElementById('view-active');
    const questionTextElement = document.getElementById('question-text');
    const commentInput = document.getElementById('comment-input');
    const sendMsg = document.getElementById('send-msg');

    let currentQuestionText = '';

    function renderUserView(status, question) {
      currentQuestionText = question || '';
      if (status === 'active') {
        viewWaiting.classList.add('hidden');
        viewActive.classList.remove('hidden');
        questionTextElement.textContent = currentQuestionText || '（質問文が設定されていません）';
      } else {
        viewActive.classList.add('hidden');
        viewWaiting.classList.remove('hidden');
      }
    }

    async function checkStatus() {
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getState`, { redirect: 'follow' });
        const data = await res.json();
        if (data) renderUserView(data.status, data.question);
      } catch (e) { console.error(e); }
    }

    async function sendComment(e) {
      e.preventDefault();
      const text = commentInput.value.trim();
      if (!text) return;

      let targetQ = currentQuestionText || questionTextElement.textContent.trim();

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'cors',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'addComment',
            text: text,
            question_text: targetQ || '無題の質問'
          })
        });

        commentInput.value = '';
        sendMsg.classList.remove('hidden');
        setTimeout(() => sendMsg.classList.add('hidden'), 2000);
      } catch (err) {
        console.error('送信エラー:', err);
      }
    }

    checkStatus();
    setInterval(checkStatus, 2000);
  </script>
</body>
</html>
