<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理・スクリーン投影 | Live Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000, -2px 2px 0px #000, 2px -2px 0px #000, -2px -2px 0px #000;
      will-change: transform;
      animation: danmaku 8s linear forwards;
    }
    @keyframes danmaku {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between relative select-none">

  <!-- ヘッダー -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 p-4 z-50 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xs uppercase font-bold text-slate-400">STATUS:</span>
        <span id="current-status-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-yellow-500/20 text-yellow-300 border border-yellow-500/30">
          同期中...
        </span>
      </div>

      <div class="flex-1 max-w-xl flex gap-2">
        <input type="text" id="question-input" placeholder="投映する質問文を入力..." 
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        <button id="btn-active" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors">
          質問を表示する
        </button>
        <button id="btn-waiting" type="button" class="bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors">
          待機中にする
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-show-qr" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow">
          <span>📱 参加用QR</span>
        </button>
        <button id="btn-toggle-view" type="button" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow">
          <span>📝 記録一覧を見る</span>
          <span id="header-comment-count" class="bg-amber-800/60 text-amber-200 text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 投影エリア -->
  <main id="view-screen" class="flex-1 flex items-center justify-center p-8 relative">
    <div id="display-area" class="text-center z-10 max-w-4xl mx-auto
